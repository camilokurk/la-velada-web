
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entradas | Night Clash 2027</title>
    <meta name="description" content="Entradas para Night Clash 2027">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/dark-mode.js" defer></script>
    <script src="../js/price-calc.js" defer></script>
    <script src="../js/validation-confirmation.js" defer></script>
    <script src="../js/summary-reservation.js" defer></script>
    <script src="../js/tickets.js" defer></script>
</head>
<body>

<header id="header">
    <a href="../index.html">
        <img src="../assets/images/general/logo.svg" alt="Night Clash 2027">
    </a>

    <nav id="header-pages">
        <ul>
            <li><a href="../index.html">Inicio</a></li>
            <li><a href="combats.html">Combates</a></li>
            <li><a href="tickets.html" aria-current="page">Entradas</a></li>
            <li><a href="faq.html">FAQ</a></li>
            <li><a href="press.html">Prensa</a></li>
        </ul>
    </nav>

    <button type="button" id="dark-mode"
            aria-label="Activar el modo oscuro"></button>
</header>

<main>
    <section id="tickets">
        <h1>Compra tus entradas</h1>
        <p>Elige tu entrada para Night Clash 2027.</p>

       <p id="confirmation-message" role="status"
   aria-live="polite"></p>
        <form id="ticket-form">

            <label for="ticket-type">Tipo de entrada:</label>
            <select id="ticket-type" required>
                <option value="50">Entrada general - 50 €</option>
                <option value="100">Entrada premium - 100 €</option>
                <option value="200">Entrada VIP - 200 €</option>
                <option value="300">Entrada exclusiva - 300 €</option>
            </select>

            <label for="quantity">Cantidad de entradas:</label>
            <input type="number" id="quantity"
                   min="1" max="10" value="1" required>

            <div id="total-price" aria-live="polite">
                <h2>Precio total: <span id="total">50,00 €</span></h2>
            </div>

            <button type="submit">Continuar</button>

        </form>
    </section>
</main>

<footer>
    <div>
        <h2>Contacto</h2>
        <address>
            <a href="mailto:contacto@velada.com">Enviar correo</a>
        </address>
    </div>

    <div>
        <h2>Redes</h2>
        <ul>
            <li><a href="https://www.instagram.com/infolavelada/?hl=es" target="_blank" rel="noopener">Instagram</a></li>
            <li><a href="https://x.com/infoLaVelada" target="_blank" rel="noopener">X</a></li>
        </ul>
    </div>

    <div>
        <h2>Legal</h2>
        <a href="#">Aviso legal</a>
    </div>

    <small>© 2026 JhaCaMo Studio S.L. · Proyecto académico</small>
</footer>

</body>
</html>
